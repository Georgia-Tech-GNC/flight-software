name: Check CMake Build

on:
  push:
    branches: ["main", "project/*"]
  pull_request: 
    branches: ["main", "project/*"]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: nixos/nix:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        nix-shell
    
    - name: Build and check (ncl-f429-dev)
      run: .github/scripts/build_and_check.sh ncl-f429-dev

    - name: Build and check (ncl-h723-dev)
      run: .github/scripts/build_and_check.sh ncl-h723-dev

    - name: Renode test (ncl-h723-dev)
      run: .github/scripts/renode_test.sh
