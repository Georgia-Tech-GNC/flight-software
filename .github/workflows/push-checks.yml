name: Check CMake Build

on:
  push:
    branches: ["main", "project/*"]
  pull_request: 
    branches: ["main", "project/*"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main

    - name: Build and check (ncl-f429-dev)
      run: nix develop --command .github/scripts/build_and_check.sh ncl-f429-dev

    - name: Build and check (ncl-h723-dev)
      run: nix develop --command .github/scripts/build_and_check.sh ncl-h723-dev

    - name: Renode test (ncl-h723-dev)
      run: nix develop --command .github/scripts/renode_test.sh

    - name: Upload Renode test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: renode-test-results
        path: test-results/
        if-no-files-found: error
