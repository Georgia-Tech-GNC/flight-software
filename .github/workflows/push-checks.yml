name: Check CMake Build

on:
  push:
    branches: ["main", "project/*"]
  pull_request: 
    branches: ["main", "project/*"]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: nixos/nix:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main

    - name: Build and check (ncl-f429-dev)
      run: nix-shell --run '.github/scripts/build_and_check.sh ncl-f429-dev'

    - name: Build and check (ncl-h723-dev)
      run: nix-shell --run '.github/scripts/build_and_check.sh ncl-h723-dev'

    - name: Renode test (ncl-h723-dev)
      run: nix-shell --run '.github/scripts/renode_test.sh'

